name: Seite und Podcast bauen

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Neueste Folge jetzt an Telegram senden (Test)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://mrnemorian.github.io/ki-radar
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stimme aus dem Cache laden
        id: voice-cache
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-de_DE-thorsten-high-v1

      - name: Stimme herunterladen
        if: steps.voice-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p voices
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high
          curl -fsSL -o voices/de_DE-thorsten-high.onnx "$base/de_DE-thorsten-high.onnx"
          curl -fsSL -o voices/de_DE-thorsten-high.onnx.json "$base/de_DE-thorsten-high.onnx.json"

      - name: Werkzeuge installieren
        run: |
          pip install --quiet piper-tts pillow
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null

      - name: Seite, Folgen und Feed bauen
        id: build
        run: python scripts/build_site.py

      - name: Neue Folge an Telegram senden
        if: (steps.build.outputs.new_episode != '' || inputs.send_telegram) && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_IDS != ''
        env:
          NEW: ${{ steps.build.outputs.new_episode || steps.build.outputs.latest_episode }}
        run: |
          for id in $(echo "$TELEGRAM_CHAT_IDS" | tr ',;' '  '); do
            if curl -sS -f -o /dev/null                  -F chat_id="$id"                  -F audio=@"_site/audio/${NEW}.mp3"                  -F caption="$(cat telegram_caption.txt)"                  -F title="IT-GRC Radar ${NEW}"                  -F performer="IT-GRC Radar"                  "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendAudio"; then
              echo "Gesendet an Empfänger ${id:0:6}…"
            else
              echo "::warning::Telegram-Versand an einen Empfänger fehlgeschlagen"
            fi
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
